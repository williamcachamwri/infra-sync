name: Pull Shark CI

on:
  schedule:
    # Chạy 2 lần/ngày vào 10:17 và 22:43 giờ Việt Nam
    - cron: "17 3 * * *"
    - cron: "43 15 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Số lượng PR tối đa trong lần chạy này (1-150)"
        required: false
        default: "25"
        type: string
      delay_seconds:
        description: "Thời gian nghỉ giữa mỗi PR (giây)"
        required: false
        default: "6"
        type: string
      max_repo_prs:
        description: "Mốc dừng tổng PR trên repo (106 = Silver 130 PR, 1005 = Gold 1029 PR)"
        required: false
        default: "1005"
        type: string
      coauthor_trailer:
        description: "Tuỳ chọn Co-author để cày kèm Pair Extraordinaire (VD: Name <email@example.com>)"
        required: false
        default: ""
        type: string

concurrency:
  group: pull-shark-main
  cancel-in-progress: false

jobs:
  pull-shark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Kiểm tra Secret GH_PAT
        env:
          CHECK_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$CHECK_PAT" ]; then
            {
              echo "### ⚠️ Chưa cấu hình Secret \`GH_PAT\`"
              echo "GitHub không tính PR do \`GITHUB_TOKEN\` (\`github-actions[bot]\`) tạo vào badge **Pull Shark** của bạn."
              echo ""
              echo "Vui lòng thêm Fine-grained Personal Access Token vào **Settings -> Secrets and variables -> Actions -> New repository secret** với tên \`GH_PAT\` (quyền \`Contents: Read & write\` và \`Pull requests: Read & write\` chỉ cho repo \`pull-shark-ci\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing repository secret GH_PAT. See Job Summary for setup instructions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Run PR batch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.BATCH_SIZE || '25' }}
          DELAY_SECONDS: ${{ inputs.delay_seconds || vars.DELAY_SECONDS || '6' }}
          MAX_REPO_PRS: ${{ inputs.max_repo_prs || vars.MAX_REPO_PRS || '1005' }}
          COAUTHOR_TRAILER: ${{ inputs.coauthor_trailer || vars.COAUTHOR_TRAILER || '' }}
        run: bash scripts/run_batch.sh
