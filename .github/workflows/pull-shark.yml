name: State Sync CI

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Batch size (1-600)"
        required: false
        default: "520"
        type: string
      delay_seconds:
        description: "Delay between syncs (s)"
        required: false
        default: "10"
        type: string
      max_repo_prs:
        description: "Target sequence ceiling"
        required: false
        default: "1010"
        type: string
      coauthor_trailer:
        description: "Optional Co-authored-by trailer"
        required: false
        default: ""
        type: string

concurrency:
  group: infra-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check credentials
        env:
          CHECK_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$CHECK_PAT" ]; then
            echo "::error::Missing repository secret GH_PAT."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Run checkpoint batch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.BATCH_SIZE || '520' }}
          DELAY_SECONDS: ${{ inputs.delay_seconds || vars.DELAY_SECONDS || '10' }}
          MAX_REPO_PRS: ${{ inputs.max_repo_prs || vars.MAX_REPO_PRS || '1010' }}
          COAUTHOR_TRAILER: ${{ inputs.coauthor_trailer || vars.COAUTHOR_TRAILER || '' }}
        run: bash scripts/run_batch.sh
